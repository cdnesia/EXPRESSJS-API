services:
  expressjs-api:
    build: .
    container_name: expressjs-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    networks:
      - traefik-proxy
      - database
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.expressjs-api.rule=Host(`api.umjambi.ac.id`)"
      - "traefik.http.routers.expressjs-api.entrypoints=websecure"
      - "traefik.http.routers.expressjs-api.tls=true"
      - "traefik.http.services.expressjs-api.loadbalancer.server.port=3000"

networks:
  traefik-proxy:
    name: traefik-proxy
    external: true
  database:
    name: mariadb-database
    external: true